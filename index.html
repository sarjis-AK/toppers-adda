                    { id: 'topic-practice', label: t.nav.topicPractice },
                    { id: 'study-materials', label: t.nav.studyMaterials },
                    { id: 'pyq', label: t.nav.pyq },
                    { id: 'pricing', label: t.nav.pricing },
                    { id: 'about', label: t.nav.about },
                    { id: 'contact', label: t.nav.contact }
                ];

                return (
                    <header className="sticky top-0 z-40 shadow-md">
                        <div className="bg-[#0B1730] text-white text-xs py-2 px-4 border-b border-blue-900/60">
                            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
                                <div className="flex items-center space-x-2">
                                    <span className="px-2 py-0.5 rounded bg-[#1D4ED8] text-[#FFFFFF] font-bold text-[10px] tracking-wider uppercase">
                                        LIVE OFFER
                                    </span>
                                    <span className="text-blue-100 font-medium truncate max-w-xl">
                                        {pricingConfig.offerBannerText}
                                    </span>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <button
                                        onClick={() => navigateTo('student-dashboard')}
                                        className={`hover:text-[#60A5FA] transition-colors flex items-center gap-1 font-semibold ${currentPage === 'student-dashboard' ? 'text-[#60A5FA]' : 'text-gray-200'}`}
                                    >
                                        <User className="w-3.5 h-3.5" /> {t.nav.studentDash}
                                    </button>
                                    <span className="text-gray-600">|</span>
                                    <button
                                        onClick={() => navigateTo('admin-dashboard')}
                                        className={`hover:text-[#60A5FA] transition-colors flex items-center gap-1 font-semibold ${currentPage === 'admin-dashboard' ? 'text-[#60A5FA]' : 'text-amber-300'}`}
                                    >
                                        <Shield className="w-3.5 h-3.5" /> {t.nav.adminDash}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white border-b border-slate-200">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
                                <div
                                    onClick={() => navigateTo('home')}
                                    className="flex items-center space-x-3 cursor-pointer group shrink-0"
                                >
                                    <div className="w-11 h-11 rounded-xl bg-[#0B1730] flex items-center justify-center text-white font-extrabold text-xl shadow-md group-hover:bg-[#1D4ED8] transition-colors border-2 border-[#60A5FA]/40">
                                        MA
                                    </div>
                                    <div>
                                        <div className="flex items-center gap-1.5">
                                            <span className="text-lg sm:text-xl font-extrabold tracking-tight text-[#0B1730]">
                                                MOCK ACADEMY
                                            </span>
                                            <span className="hidden sm:inline-block text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-blue-50 text-[#1D4ED8] border border-blue-200">
                                                {t.brandSub}
                                            </span>
                                        </div>
                                        <span className="block text-[11px] font-semibold text-slate-500 tracking-wide">
                                            {t.tagline}
                                        </span>
                                    </div>
                                </div>

                                <nav className="hidden xl:flex items-center space-x-1">
                                    {primaryLinks.map((link) => (
                                        <button
                                            key={link.id}
                                            onClick={() => navigateTo(link.id)}
                                            className={`px-3 py-2 rounded-lg text-xs font-bold transition-all ${
                                                currentPage === link.id
                                                    ? 'bg-[#1D4ED8] text-white shadow-sm'
                                                    : 'text-[#0B1730] hover:bg-slate-100 hover:text-[#1D4ED8]'
                                            }`}
                                        >
                                            {link.label}
                                        </button>
                                    ))}
                                </nav>

                                <div className="flex items-center space-x-2 sm:space-x-3">
                                    <div className="flex items-center bg-[#F5F7FB] border border-slate-300 rounded-lg p-1 text-xs font-bold">
                                        <Globe className="w-3.5 h-3.5 text-[#1D4ED8] ml-1.5 mr-1 hidden sm:inline" />
                                        {[
                                            { code: 'en', label: 'EN' },
                                            { code: 'hi', label: 'हिन्दी' },
                                            { code: 'as', label: 'অসমীয়া' }
                                        ].map((l) => (
                                            <button
                                                key={l.code}
                                                onClick={() => {
                                                    setLang(l.code);
                                                    showToast(`Interface language switched to ${l.label}`);
                                                }}
                                                className={`px-2 py-1 rounded-md transition-colors ${
                                                    lang === l.code
                                                        ? 'bg-[#0B1730] text-white'
                                                        : 'text-slate-700 hover:bg-slate-200'
                                                }`}
                                            >
                                                {l.label}
                                            </button>
                                        ))}
                                    </div>

                                    <button
                                        onClick={() => navigateTo('login')}
                                        className="hidden sm:inline-flex items-center px-3.5 py-2 rounded-lg text-xs font-bold text-[#0B1730] border border-slate-300 hover:bg-slate-100 transition-colors"
                                    >
                                        {t.nav.login}
                                    </button>
                                    <button
                                        onClick={() => navigateTo('register')}
                                        className="hidden sm:inline-flex items-center px-4 py-2 rounded-lg text-xs font-bold text-white bg-[#1D4ED8] hover:bg-blue-800 shadow-sm transition-colors"
                                    >
                                        {t.nav.register}
                                    </button>

                                    <button
                                        onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                        className="xl:hidden p-2 rounded-lg text-[#0B1730] hover:bg-slate-100 border border-slate-200"
                                    >
                                        {mobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                                    </button>
                                </div>
                            </div>

                            {mobileMenuOpen && (
                                <div className="xl:hidden bg-white border-b border-slate-200 px-4 pt-3 pb-6 space-y-2 shadow-xl">
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                        {primaryLinks.map((link) => (
                                            <button
                                                key={link.id}
                                                onClick={() => navigateTo(link.id)}
                                                className={`px-3 py-2.5 rounded-lg text-left text-xs font-bold ${
                                                    currentPage === link.id
                                                        ? 'bg-[#1D4ED8] text-white'
                                                        : 'bg-[#F5F7FB] text-[#0B1730] hover:bg-slate-200'
                                                }`}
                                            >
                                                {link.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="pt-3 border-t border-slate-200 flex flex-wrap gap-2">
                                        <button
                                            onClick={() => navigateTo('student-dashboard')}
                                            className="flex-1 py-2.5 px-3 rounded-lg bg-[#0B1730] text-white text-xs font-bold text-center"
                                        >
                                            {t.nav.studentDash}
                                        </button>
                                        <button
                                            onClick={() => navigateTo('admin-dashboard')}
                                            className="flex-1 py-2.5 px-3 rounded-lg bg-amber-500 text-[#0B1730] text-xs font-bold text-center"
                                        >
                                            {t.nav.adminDash}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>
                );
            };

            const [homeSearch, setHomeSearch] = useState('');
            const [activeExamTab, setActiveExamTab] = useState('ALL');
            const [openFaq, setOpenFaq] = useState(0);

            const renderHomePage = () => {
                const filteredExams = exams.filter((ex) => {
                    const matchesCat = activeExamTab === 'ALL' || ex.category === activeExamTab;
                    const matchesQuery =
                        ex.name.toLowerCase().includes(homeSearch.toLowerCase()) ||
                        ex.fullName.toLowerCase().includes(homeSearch.toLowerCase()) ||
                        ex.category.toLowerCase().includes(homeSearch.toLowerCase());
                    return matchesCat && matchesQuery;
                });

                return (
                    <div className="space-y-16 pb-16">
                        <section className="bg-[#0B1730] text-white relative overflow-hidden pt-12 pb-20 border-b-4 border-[#1D4ED8]">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                                    <div className="lg:col-span-7 space-y-6">
                                        <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-blue-900/60 border border-[#60A5FA]/40 text-[#60A5FA] text-xs font-bold">
                                            <Sparkles className="w-3.5 h-3.5" />
                                            <span>{t.hero.badge}</span>
                                        </div>
                                        <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight text-white">
                                            {t.hero.title}
                                        </h1>
                                        <p className="text-slate-300 text-base sm:text-lg leading-relaxed max-w-2xl">
                                            {t.hero.subtitle}
                                        </p>
                                        <div className="bg-white p-2 rounded-xl shadow-lg flex flex-col sm:flex-row items-center gap-2 max-w-2xl">
                                            <div className="flex items-center w-full px-3 py-2 text-slate-800">
                                                <Search className="w-5 h-5 text-[#1D4ED8] mr-3 shrink-0" />
                                                <input
                                                    type="text"
                                                    value={homeSearch}
                                                    onChange={(e) => setHomeSearch(e.target.value)}
                                                    placeholder={t.hero.searchPlaceholder}
                                                    className="w-full text-sm font-medium focus:outline-none text-[#0B1730]"
                                                />
                                            </div>
                                            <button
                                                onClick={() => navigateTo('all-exams')}
                                                className="w-full sm:w-auto px-6 py-3 rounded-lg bg-[#1D4ED8] hover:bg-blue-800 text-white font-bold text-xs uppercase tracking-wider shrink-0 transition-colors"
                                            >
                                                {t.hero.exploreBtn}
                                            </button>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-5">
                                        <div className="bg-white text-[#0B1730] rounded-2xl p-6 shadow-2xl border border-slate-200 space-y-5">
                                            <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                                                <div>
                                                    <span className="text-[11px] font-extrabold uppercase tracking-wider text-[#1D4ED8] bg-blue-50 px-2.5 py-1 rounded-md">
                                                        Interactive CBT Engine
                                                    </span>
                                                    <h3 className="text-lg font-extrabold text-[#0B1730] mt-1">
                                                        All-India & Assam Mock Series
                                                    </h3>
                                                </div>
                                                <Award className="w-10 h-10 text-[#1D4ED8]" />
                                            </div>
                                            <div className="p-4 rounded-xl bg-blue-50/80 border border-blue-200 space-y-2">
                                                <div className="flex items-center justify-between text-xs font-bold text-[#0B1730]">
                                                    <span>Featured: 10-Question Live CBT Demo</span>
                                                    <span className="text-[#1D4ED8]">15 Mins • 20 Marks</span>
                                                </div>
                                                <button
                                                    onClick={() => startMockTest(mockTests[0])}
                                                    className="w-full py-2.5 rounded-lg bg-[#0B1730] hover:bg-[#1D4ED8] text-white font-bold text-xs transition-colors flex items-center justify-center gap-2"
                                                >
                                                    <Play className="w-3.5 h-3.5 fill-current" /> Launch Instant Demo Test
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                );
            };

            const renderAllExamsPage = () => (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">All Competitive Examinations</h1>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {exams.map((ex) => (
                            <div key={ex.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <h3 className="text-xl font-extrabold">{ex.name}</h3>
                                <p className="text-xs text-slate-600">{ex.fullName}</p>
                                <button onClick={() => startMockTest(mockTests[0])} className="w-full py-2.5 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Attempt Mock</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderMockTestsPage = () => (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-8">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">Mock Test Catalogue</h1>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {mockTests.map((test) => (
                            <div key={test.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <h3 className="text-lg font-extrabold">{test.title}</h3>
                                <button onClick={() => startMockTest(test)} className="w-full py-2.5 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Start Test</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderTopicPracticePage = () => (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-6">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">Topic-Wise Practice</h1>
                    {questions.map((q, i) => (
                        <div key={q.id} className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3">
                            <h3 className="font-bold text-sm">Q{i+1}: {q.question.en}</h3>
                        </div>
                    ))}
                </div>
            );

            const renderStudyMaterialsPage = () => (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-6">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">Study Materials & PDF Library</h1>
                    {studyMaterials.map((pdf) => (
                        <div key={pdf.id} className="bg-white p-6 rounded-2xl border border-slate-200 flex justify-between items-center">
                            <div>
                                <h3 className="font-extrabold text-sm">{pdf.title}</h3>
                                <p className="text-xs text-slate-500">{pdf.exam}</p>
                            </div>
                            <button onClick={() => showToast('Preview notes opened')} className="px-4 py-2 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Preview</button>
                        </div>
                    ))}
                </div>
            );

            const renderPyqPage = () => (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-6">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">Previous Year Papers</h1>
                    {INITIAL_PYQS.map((pyq) => (
                        <div key={pyq.id} className="bg-white p-6 rounded-2xl border border-slate-200 flex justify-between items-center">
                            <div>
                                <h3 className="font-extrabold text-sm">{pyq.title}</h3>
                                <p className="text-xs text-slate-500">Year: {pyq.year}</p>
                            </div>
                            <button onClick={() => startMockTest(mockTests[0])} className="px-4 py-2 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Attempt</button>
                        </div>
                    ))}
                </div>
            );

            const renderPricingPage = () => (
                <div className="max-w-5xl mx-auto px-4 py-12 text-center space-y-6">
                    <h1 className="text-4xl font-extrabold text-[#0B1730]">Transparent Test Packages</h1>
                    <div className="bg-[#0B1730] text-white p-8 rounded-3xl max-w-md mx-auto space-y-4">
                        <h3 className="text-xl font-bold">5-Test Starter Pack</h3>
                        <p className="text-3xl font-extrabold">₹{pricingConfig.fivePackOffer} <span className="line-through text-slate-400 text-base">₹{pricingConfig.fivePackRegular}</span></p>
                        <button onClick={() => showToast('Pack unlocked in demo')} className="w-full py-3 bg-[#1D4ED8] rounded-xl font-bold text-xs">Unlock Pack</button>
                    </div>
                </div>
            );

            const renderAboutPage = () => (
                <div className="max-w-4xl mx-auto px-4 py-12 space-y-4 bg-white rounded-3xl border border-slate-200 my-8 p-8">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">About MOCK ACADEMY</h1>
                    <p className="text-xs text-slate-600 leading-relaxed">Topper's Adda is built to support competitive exam aspirants across India and Assam with real-time CBT mock tests.</p>
                </div>
            );

            const renderContactPage = () => (
                <div className="max-w-4xl mx-auto px-4 py-12 bg-white rounded-3xl border border-slate-200 my-8 p-8 space-y-4">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">Contact Us</h1>
                    <p className="text-xs text-slate-600">Email: {contactInfo.email}</p>
                    <p className="text-xs text-slate-600">Address: {contactInfo.address}</p>
                </div>
            );

            const renderAuthPage = (isReg = false) => (
                <div className="max-w-md mx-auto px-4 py-12">
                    <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-lg space-y-6 text-center">
                        <h1 className="text-2xl font-extrabold text-[#0B1730]">{isReg ? 'Create Account' : 'Sign In'}</h1>
                        <button onClick={() => navigateTo('student-dashboard')} className="w-full py-3 bg-[#1D4ED8] text-white rounded-xl font-bold text-xs">Enter Student Dashboard</button>
                    </div>
                </div>
            );

            const renderStudentDashboard = () => (
                <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                    <h1 className="text-2xl font-extrabold text-[#0B1730]">Student Dashboard: {studentData.name}</h1>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-2">
                        <h3 className="font-bold text-sm">Attempt History</h3>
                        {studentData.attempts.map((a, i) => (
                            <p key={i} className="text-xs text-slate-600">{a.testTitle} — Score: {a.score}/{a.totalMarks} ({a.accuracy}%)</p>
                        ))}
                    </div>
                </div>
            );

            const renderAdminDashboard = () => (
                <div className="max-w-7xl mx-auto px-4 py-8 space-y-6">
                    <h1 className="text-2xl font-extrabold text-[#0B1730]">Admin Control Panel</h1>
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                        <h3 className="font-bold text-sm">Manage Exams ({exams.length})</h3>
                        <button onClick={() => { setExams([...exams, { id: 'ex-new', name: 'New Exam', category: 'SSC', fullName: 'New Exam Title', vacancies: '100', eligibility: '12th', pattern: 'CBT', testsCount: 5, pyqCount: 2, notesCount: 3, badge: 'New' }]); showToast('Exam added!'); }} className="px-4 py-2 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Add Sample Exam</button>
                    </div>
                </div>
            );

            const renderTestEnginePage = () => {
                const currentQ = questions[testState.currentIdx] || questions[0];
                return (
                    <div className="min-h-screen bg-[#F5F7FB] flex flex-col p-6 max-w-4xl mx-auto space-y-6">
                        <div className="bg-[#0B1730] text-white p-4 rounded-2xl flex justify-between items-center">
                            <h1 className="font-extrabold text-sm">{activeTest?.title || 'Mock Test'}</h1>
                            <button onClick={() => finalizeTestSubmission(testState)} className="px-4 py-2 bg-emerald-600 rounded-xl text-xs font-bold">Submit Test</button>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                            <h3 className="font-extrabold text-base">Q{testState.currentIdx + 1}: {currentQ.question[lang] || currentQ.question.en}</h3>
                            <div className="space-y-2">
                                {(currentQ.options[lang] || currentQ.options.en).map((opt, idx) => (
                                    <button key={idx} onClick={() => setTestState(prev => ({ ...prev, answers: { ...prev.answers, [prev.currentIdx]: idx } }))} className={`w-full p-3 rounded-xl border text-left text-xs font-bold ${testState.answers[testState.currentIdx] === idx ? 'bg-blue-100 border-[#1D4ED8]' : 'bg-[#F5F7FB]'}`}>
                                        {String.fromCharCode(65 + idx)}. {opt}
                                    </button>
                                ))}
                            </div>
                            <div className="flex justify-between pt-4">
                                <button disabled={testState.currentIdx === 0} onClick={() => setTestState(prev => ({ ...prev, currentIdx: prev.currentIdx - 1 }))} className="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">Previous</button>
                                <button onClick={() => setTestState(prev => ({ ...prev, currentIdx: prev.currentIdx + 1 }))} className="px-4 py-2 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Next</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderTestResultPage = () => {
                const res = testState.resultSummary || { testTitle: 'Mock Test', score: 20, totalMarks: 20, correct: 10, incorrect: 0, unattempted: 0, accuracy: 100, timeTaken: '5m' };
                return (
                    <div className="max-w-3xl mx-auto px-4 py-12 bg-white rounded-3xl border border-slate-200 my-8 p-8 text-center space-y-6">
                        <h1 className="text-3xl font-extrabold text-[#0B1730]">Performance Report</h1>
                        <p className="text-lg font-bold text-emerald-600">Score: {res.score} / {res.totalMarks} ({res.accuracy}% Accuracy)</p>
                        <button onClick={() => navigateTo('home')} className="px-6 py-3 bg-[#1D4ED8] text-white rounded-xl font-bold text-xs">Return to Home</button>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-[#F5F7FB] text-[#0B1730]">
                    {renderNavbar()}
                    <main className="flex-grow">
                        {currentPage === 'home' && renderHomePage()}
                        {currentPage === 'all-exams' && renderAllExamsPage()}
                        {currentPage === 'exam-details' && renderAllExamsPage()}
                        {currentPage === 'mock-tests' && renderMockTestsPage()}
                        {currentPage === 'topic-practice' && renderTopicPracticePage()}
                        {currentPage === 'study-materials' && renderStudyMaterialsPage()}
                        {currentPage === 'pyq' && renderPyqPage()}
                        {currentPage === 'pricing' && renderPricingPage()}
                        {currentPage === 'about' && renderAboutPage()}
                        {currentPage === 'contact' && renderContactPage()}
                        {currentPage === 'login' && renderAuthPage(false)}
                        {currentPage === 'register' && renderAuthPage(true)}
                        {currentPage === 'student-dashboard' && renderStudentDashboard()}
                        {currentPage === 'admin-dashboard' && renderAdminDashboard()}
                        {currentPage === 'test-engine' && renderTestEnginePage()}
                        {currentPage === 'test-result' && renderTestResultPage()}
                    </main>
                    {currentPage !== 'test-engine' && (
                        <footer className="bg-[#0B1730] text-slate-300 py-6 text-center text-xs">
                            © 2026 MOCK ACADEMY (Topper's Adda). All rights reserved.
                        </footer>
                    )}
                    {modalContent && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-3xl max-w-md w-full space-y-4">
                                <h3 className="font-extrabold text-lg text-[#0B1730]">{modalContent.title}</h3>
                                <p className="text-xs text-slate-600">{modalContent.body}</p>
                                <button onClick={() => setModalContent(null)} className="w-full py-2.5 bg-[#1D4ED8] text-white rounded-xl font-bold text-xs">Close</button>
                            </div>
                        </div>
                    )}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-[#0B1730] text-white px-5 py-3 rounded-2xl text-xs font-bold shadow-xl">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
