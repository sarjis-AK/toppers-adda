            const [modalContent, setModalContent] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const [activeTest, setActiveTest] = useState(null);
            const [testState, setTestState] = useState({ currentIdx: 0, answers: {}, marked: {}, visited: { 0: true }, timeLeft: 900, testLang: 'en', isSubmitted: false, resultSummary: null });

            const startMockTest = (testObj) => {
                setActiveTest(testObj || mockTests[0]);
                setTestState({ currentIdx: 0, answers: {}, marked: {}, visited: { 0: true }, timeLeft: 900, testLang: lang, isSubmitted: false, resultSummary: null });
                setCurrentPage('test-engine');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const finalizeTestSubmission = (snapshot = testState) => {
                setCurrentPage('home');
                showToast('Mock Test submitted successfully!');
            };

            const navigateTo = (page, examId = null) => {
                if (examId) setSelectedExamId(examId);
                setCurrentPage(page);
                setMobileMenuOpen(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const t = TRANSLATIONS[lang] || TRANSLATIONS.en;

            const renderNavbar = () => {
                if (currentPage === 'test-engine') return null;
                return (
                    <header className="sticky top-0 z-40 shadow-md bg-white">
                        <div className="bg-[#0B1730] text-white text-xs py-2 px-4">
                            <div className="max-w-7xl mx-auto flex justify-between">
                                <span>{pricingConfig.offerBannerText}</span>
                                <div className="space-x-4">
                                    <button onClick={() => navigateTo('student-dashboard')} className="hover:text-blue-300 font-semibold">Student Dashboard</button>
                                    <button onClick={() => navigateTo('admin-dashboard')} className="hover:text-amber-300 font-semibold">Admin Panel</button>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                            <div onClick={() => navigateTo('home')} className="flex items-center space-x-3 cursor-pointer">
                                <div className="w-11 h-11 rounded-xl bg-[#0B1730] text-white flex items-center justify-center font-extrabold text-xl">MA</div>
                                <div>
                                    <span className="text-xl font-extrabold text-[#0B1730]">MOCK ACADEMY</span>
                                    <span className="block text-xs text-slate-500 font-semibold">{t.tagline}</span>
                                </div>
                            </div>
                            <nav className="hidden md:flex space-x-6 text-xs font-bold text-[#0B1730]">
                                <button onClick={() => navigateTo('home')} className="hover:text-blue-600">Home</button>
                                <button onClick={() => navigateTo('all-exams')} className="hover:text-blue-600">All Exams</button>
                                <button onClick={() => navigateTo('mock-tests')} className="hover:text-blue-600">Mock Tests</button>
                                <button onClick={() => navigateTo('topic-practice')} className="hover:text-blue-600">Topic Practice</button>
                                <button onClick={() => navigateTo('pricing')} className="hover:text-blue-600">Pricing</button>
                            </nav>
                            <div className="flex items-center space-x-2">
                                <button onClick={() => setLang(lang === 'en' ? 'hi' : 'en')} className="px-3 py-1 bg-slate-100 rounded text-xs font-bold">
                                    {lang.toUpperCase()}
                                </button>
                            </div>
                        </div>
                    </header>
                );
            };

            const renderHomePage = () => (
                <div className="space-y-12 pb-16">
                    <section className="bg-[#0B1730] text-white py-16 px-4 text-center space-y-6">
                        <h1 className="text-4xl font-extrabold">{t.hero.title}</h1>
                        <p className="text-slate-300 max-w-2xl mx-auto text-sm">{t.hero.subtitle}</p>
                        <button onClick={() => startMockTest(mockTests[0])} className="px-8 py-4 bg-[#1D4ED8] hover:bg-blue-600 rounded-xl font-extrabold text-sm shadow-lg">
                            {t.hero.practiceBtn}
                        </button>
                    </section>
                </div>
            );

            const renderMockTestsPage = () => (
                <div className="max-w-7xl mx-auto px-4 py-10 space-y-6">
                    <h1 className="text-3xl font-extrabold text-[#0B1730]">Mock Tests Catalogue</h1>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {mockTests.map((m) => (
                            <div key={m.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <h3 className="font-extrabold text-lg">{m.title}</h3>
                                <button onClick={() => startMockTest(m)} className="px-4 py-2 bg-[#1D4ED8] text-white rounded-xl text-xs font-bold">Start Test</button>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const renderTestEnginePage = () => {
                const currentQ = questions[testState.currentIdx] || questions[0];
                return (
                    <div className="min-h-screen bg-[#F5F7FB] flex flex-col p-6 max-w-4xl mx-auto space-y-6">
                        <div className="bg-[#0B1730] text-white p-4 rounded-2xl flex justify-between items-center">
                            <h1 className="font-extrabold text-sm">{activeTest?.title || 'Mock Test'}</h1>
                            <button onClick={() => finalizeTestSubmission()} className="px-4 py-2 bg-emerald-600 rounded-xl text-xs font-bold">Submit Test</button>
                        </div>
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                            <h3 className="font-extrabold text-base">Q1: {currentQ.question.en}</h3>
                            <div className="space-y-2">
                                {currentQ.options.en.map((opt, idx) => (
                                    <button key={idx} onClick={() => showToast('Option selected')} className="w-full p-3 rounded-xl border text-left text-xs font-bold bg-[#F5F7FB] hover:bg-blue-50">
                                        {String.fromCharCode(65 + idx)}. {opt}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-[#F5F7FB] text-[#0B1730]">
                    {renderNavbar()}
                    <main className="flex-grow">
                        {currentPage === 'home' && renderHomePage()}
                        {currentPage === 'mock-tests' && renderMockTestsPage()}
                        {currentPage === 'test-engine' && renderTestEnginePage()}
                        {currentPage === 'all-exams' && <div className="p-12 text-center font-bold">All Exams Directory View</div>}
                        {currentPage === 'topic-practice' && <div className="p-12 text-center font-bold">Topic Practice Module</div>}
                        {currentPage === 'pricing' && <div className="p-12 text-center font-bold">Pricing Packages View</div>}
                        {currentPage === 'student-dashboard' && <div className="p-12 text-center font-bold">Student Dashboard View</div>}
                        {currentPage === 'admin-dashboard' && <div className="p-12 text-center font-bold">Admin Panel View</div>}
                    </main>
                    <footer className="bg-[#0B1730] text-slate-300 py-6 text-center text-xs">
                        © 2026 MOCK ACADEMY (Topper's Adda). All rights reserved.
                    </footer>
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-[#0B1730] text-white px-5 py-3 rounded-2xl text-xs font-bold shadow-xl">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
